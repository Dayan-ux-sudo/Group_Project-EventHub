services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventhub"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py seed_campus_data && python manage.py runserver 0.0.0.0:8000 --noreload"
    env_file:
      - .env
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,[::1],backend
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: eventhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media

  celery_worker:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    restart: unless-stopped
    command: celery -A eventhub worker --loglevel=info
    env_file:
      - .env
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1,[::1],backend
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: eventhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  celery_beat:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    restart: unless-stopped
    command: celery -A eventhub beat --loglevel=info
    env_file:
      - .env
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1,[::1],backend
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: eventhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Frontend/event-hub-client/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  backend_media:
