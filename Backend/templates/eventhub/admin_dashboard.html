<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventHub — Admin</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --accent-hover: #5c9dff;
      --border: #2d3a4d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0 0 1.75rem;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .cta {
      display: block;
      width: 100%;
      text-align: center;
      padding: 0.85rem 1.25rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.15s ease;
    }
    .cta:hover { background: var(--accent-hover); }
    .cta-secondary {
      margin-top: 0.75rem;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .cta-secondary:hover {
      color: var(--text);
      border-color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
    }
    .api {
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    .api h2 {
      margin: 0 0 0.65rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
    }
    .api ul {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 0.875rem;
    }
    .api li { margin-bottom: 0.4rem; }
    .api a { color: var(--accent); text-decoration: none; }
    .api a:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.25rem 0.5rem;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(61, 139, 253, 0.15);
      color: var(--accent);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Staff</span>
    <h1>EventHub</h1>
    <p class="subtitle">
      Sign in with a staff account to open the Django admin and manage users, events, and data.
    </p>
    {% if user.is_authenticated and user.is_staff %}
      <a class="cta" href="{% url 'admin:index' %}">Open admin dashboard</a>
      <a class="cta cta-secondary" href="{% url 'admin:logout' %}">Sign out</a>
    {% else %}
      <a class="cta" href="{% url 'admin:login' %}?next={% url 'admin:index' %}">Sign in to admin</a>
    {% endif %}
    <div class="api">
      <h2>API base paths</h2>
      <ul>
        <li><a href="/api/auth/">/api/auth/</a></li>
        <li><a href="/api/events/">/api/events/</a></li>
        <li><a href="/api/token/">/api/token/</a></li>
      </ul>
    </div>
  </div>
</body>
</html>
